[project]
name = "quizforge"
version = "0.3.0"
description = "QuizForge Python AI backend portfolio"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "cryptography>=46,<51",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
